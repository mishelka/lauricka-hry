name: Deploy GitHub Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react/package-lock.json

      - name: Build React app
        working-directory: react
        run: |
          npm ci
          npm run build

      - name: Prepare Pages artifact
        run: |
          rm -rf public
          mkdir -p public
          mkdir -p public/react

          # Publish built React app under /react.
          cp -r react/dist/* public/react/

          # Root entry points redirect legacy URLs into React routes.
          cp index.html obojake.html slova-yi.html yi.html ratanie.html public/

          # SPA fallback for BrowserRouter deep links on GitHub Pages.
          cat > public/404.html <<'EOF'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>
              (function () {
                var path = window.location.pathname;
                var search = window.location.search ? window.location.search.slice(1) : '';
                var hash = window.location.hash ? window.location.hash.slice(1) : '';
                var target = '/lauricka-hry/react/?p=' + encodeURIComponent(path);
                if (search) target += '&q=' + encodeURIComponent(search);
                if (hash) target += '&h=' + encodeURIComponent(hash);
                window.location.replace(target);
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
