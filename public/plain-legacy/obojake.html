<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hra: Spoluhlásky</title>
    <link rel="stylesheet" href="css/obojake.css">
</head>
<body>
    <div id="app-container">
        <div id="game-ui">
            <h1>Aká je to spoluhláska?</h1>
            <div id="score-board">
                Správne: <span id="hit" style="color: #28a745; font-weight: bold;">0</span> |
                Chyby: <span id="miss" style="color: #d9534f; font-weight: bold;">0</span>
            </div>
            <div id="best-stars">Najviac hviezd: 0/5 ★</div>
            <div id="pismeno">?</div>

            <div class="button-container">
                <button id="btn-tvrde" class="btn-tvrde" onclick="check('tvrde')">Tvrdá</button>
                <button id="btn-makke" class="btn-makke" onclick="check('makke')">Mäkká</button>
                <button id="btn-obojake" class="btn-obojake" onclick="check('obojake')">Obojaká I Y</button>
            </div>
        </div>

        <div id="vysledok-box">
            <h2>Koniec hry!</h2>
            <div class="stars" id="hviezdy"></div>
            <div class="chyby-list" id="chyby-text"></div>
            <button class="nova-hra" onclick="restart()">Nová hra</button>
        </div>
    </div>

    <div id="fireworks-overlay"></div>

    <script src="js/tasks.js"></script>
    <script src="js/player.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/obojake.js"></script>
</body>
</html>
