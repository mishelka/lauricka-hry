<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hra: Spoluhlásky</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f8ff; margin: 0; padding: 10px; }
        #app-container { max-width: 500px; margin: 0 auto; }
        #pismeno { font-size: 100px; font-weight: bold; margin: 20px 0; }
        .button-container { display: flex; flex-direction: column; gap: 10px; padding: 0 10px; }
        button { font-size: 22px; padding: 25px; cursor: pointer; border: none; border-radius: 15px; color: white; font-weight: bold; transition: 0.2s; position: relative; }
        
        /* Neutrálne farby pre tlačidlá */
        .btn-tvrde { background-color: #5d6d7e; }
        .btn-makke { background-color: #5499c7; }
        .btn-obojake { background-color: #7d3c98; }
        
        button:disabled { opacity: 0.9; cursor: not-allowed; }
        .icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); font-size: 30px; }
        #fireworks-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1000; }
        .particle { position: absolute; width: 15px; height: 15px; border-radius: 50%; opacity: 0; }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Akej farby je spoluhláska?</h1>
        <div id="pismeno">?</div>
        
        <div class="button-container">
            <button id="btn-tvrde" class="btn-tvrde" onclick="check('tvrde')">Tvrdá</button>
            <button id="btn-makke" class="btn-makke" onclick="check('makke')">Mäkká</button>
            <button id="btn-obojake" class="btn-obojake" onclick="check('obojake')">Obojaká</button>
        </div>
    </div>

    <div id="fireworks-overlay"></div>

    <script>
        const ulohy = [
            {char: 'D', type: 'tvrde'}, {char: 'T', type: 'tvrde'}, {char: 'N', type: 'tvrde'},
            {char: 'L', type: 'tvrde'}, {char: 'K', type: 'tvrde'}, {char: 'G', type: 'tvrde'},
            {char: 'H', type: 'tvrde'}, {char: 'CH', type: 'tvrde'}, {char: 'DZ', type: 'tvrde'},

            {char: 'C', type: 'makke'}, {char: 'Č', type: 'makke'}, {char: 'Š', type: 'makke'},
            {char: 'Ž', type: 'makke'}, {char: 'Ď', type: 'makke'}, {char: 'Ť', type: 'makke'},
            {char: 'Ň', type: 'makke'}, {char: 'Ľ', type: 'makke'}, {char: 'J', type: 'makke'},
            {char: 'DZ', type: 'makke'}, {char: 'DŽ', type: 'makke'},

            {char: 'B', type: 'obojake'}, {char: 'M', type: 'obojake'}, {char: 'P', type: 'obojake'},
            {char: 'R', type: 'obojake'}, {char: 'S', type: 'obojake'}, {char: 'V', type: 'obojake'},
            {char: 'Z', type: 'obojake'}, {char: 'F', type: 'obojake'}
        ];
        let aktualna = 0;
        let blokovane = false;

        function novaUloha() {
            aktualna = Math.floor(Math.random() * ulohy.length);
            document.getElementById('pismeno').innerText = ulohy[aktualna].char;
            const buttons = document.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = false;
                b.innerHTML = b.getAttribute('data-text');
            });
            blokovane = false;
        }

        document.getElementById('btn-tvrde').setAttribute('data-text', 'Tvrdá Y');
        document.getElementById('btn-makke').setAttribute('data-text', 'Mäkká I');
        document.getElementById('btn-obojake').setAttribute('data-text', 'Obojaká');

        function triggerFireworks() {
            const overlay = document.getElementById('fireworks-overlay');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = `hsl(${Math.random()*360}, 80%, 60%)`;
                p.style.left = '50%'; p.style.top = '50%';
                overlay.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 400 + 100;
                p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }], { duration: 2500, easing: 'ease-out' }).onfinish = () => p.remove();
            }
        }

        function check(typ) {
            if (blokovane) return;
            blokovane = true;
            const btn = document.getElementById('btn-' + typ);
            
            if (typ === ulohy[aktualna].type) {
                btn.innerHTML += '<span class="icon">✅</span>';
                document.querySelectorAll('button').forEach(b => b.disabled = true);
                triggerFireworks();
                setTimeout(novaUloha, 2500);
            } else {
                btn.innerHTML += '<span class="icon">❌</span>';
                setTimeout(novaUloha, 1000);
            }
        }

        novaUloha();
    </script>
</body>
</html>
