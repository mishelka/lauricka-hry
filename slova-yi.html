<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hra: Doplň i/y</title>
    <link rel="stylesheet" href="css/slova-yi.css">
</head>
<body>
    <div id="app-container">
        <div id="level-menu">
            <h1>Slová: Levely 1-8</h1>
            <p id="level-menu-help">Na odomknutie ďalšieho levelu potrebuješ 5 hviezd v aktuálnom leveli.</p>
            <div id="levels-grid"></div>
        </div>

        <div id="game-ui">
            <h1 id="game-title">Doplň správne i/y:</h1>
            <div id="current-level"></div>
            <div id="score-board">
                Správne: <span id="hit" style="color: #28a745; font-weight: bold;">0</span> |
                Chyby: <span id="miss" style="color: #d9534f; font-weight: bold;">0</span>
            </div>
            <div id="slovo">?</div>

            <div class="button-container">
                <button id="btn-makke" class="btn-makke" onclick="check('makke')">I</button>
                <button id="btn-makke-dlhe" class="btn-makke" onclick="check('makke-dlhe')">Í</button>
                <button id="btn-tvrde" class="btn-tvrde" onclick="check('tvrde')">Y</button>
                <button id="btn-tvrde-dlhe" class="btn-tvrde" onclick="check('tvrde-dlhe')">Ý</button>
            </div>
        </div>

        <div id="vysledok-box">
            <h2>Koniec hry!</h2>
            <div class="stars" id="hviezdy"></div>
            <div id="level-progress-message"></div>
            <div class="chyby-list" id="chyby-text"></div>
            <div class="result-actions">
                <button class="nova-hra" onclick="restart()">Opakovať level</button>
                <button id="next-level-btn" class="nova-hra" onclick="nextLevel()">Ďalší level</button>
                <button class="nova-hra secondary" onclick="backToLevelMenu()">Menu levelov</button>
            </div>
        </div>
    </div>

    <div id="fireworks-overlay"></div>

    <script src="js/tasks.js"></script>
    <script src="js/player.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/slova-yi.js"></script>
</body>
</html>
