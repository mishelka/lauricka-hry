<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hra: Doplň i/y</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f8ff; margin: 0; padding: 10px; }
        #app-container { max-width: 500px; margin: 0 auto; }
        #slovo { font-size: 50px; font-weight: bold; margin: 40px 0; letter-spacing: 5px; }
        .button-container { display: flex; flex-direction: column; gap: 15px; padding: 0 10px; }
        button { font-size: 28px; padding: 30px; cursor: pointer; border: none; border-radius: 20px; color: white; font-weight: bold; transition: 0.2s; position: relative; }
        .btn-tvrde { background-color: #5d6d7e; }
        .btn-makke { background-color: #5499c7; }
        button:disabled { opacity: 0.9; cursor: not-allowed; }
        .icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 40px; }
        #fireworks-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 1000; }
        .particle { position: absolute; width: 15px; height: 15px; border-radius: 50%; opacity: 0; }
    </style>
</head>
<body>
    <div id="app-container">
        <h1>Doplň správne i/y:</h1>
        <div id="slovo">?</div>
        
        <div class="button-container">
            <button id="btn-tvrde" class="btn-tvrde" onclick="check('tvrde')">Tvrdé Y</button>
            <button id="btn-makke" class="btn-makke" onclick="check('makke')">Mäkké I</button>
        </div>
    </div>

    <div id="fireworks-overlay"></div>

    <script>
        const originalneUlohy = [
            {vypis: "D_vadlo", odpoved: "makke", cele: "Divadlo"},
            {vypis: "T_žba", odpoved: "makke", cele: "Ťažba"},
            {vypis: "L_pka", odpoved: "makke", cele: "Lipka"},
            {vypis: "K_no", odpoved: "makke", cele: "Kino"},
            {vypis: "Č_ta", odpoved: "makke", cele: "Číta"},
            {vypis: "Š_pka", odpoved: "makke", cele: "Šípka"},
            {vypis: "D_m", odpoved: "tvrde", cele: "Dym"},
            {vypis: "T_k", odpoved: "tvrde", cele: "Tyk"},
            {vypis: "N_tka", odpoved: "tvrde", cele: "Nytka"},
            {vypis: "H_dra", odpoved: "tvrde", cele: "Hydra"},
            {vypis: "L_ko", odpoved: "tvrde", cele: "Lyko"},
            {vypis: "K_tka", odpoved: "tvrde", cele: "Kytka"}
        ];

        let poradie = [];
        let index = 0;
        let blokovane = false;

        function zamiesajSadu() {
            poradie = [...originalneUlohy].sort(() => Math.random() - 0.5);
            index = 0;
        }

        function novaUloha() {
            if (index >= poradie.length) {
                zamiesajSadu();
            }
            const uloha = poradie[index];
            document.getElementById('slovo').innerText = uloha.vypis;
            const buttons = document.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = false;
                b.innerHTML = b.getAttribute('data-text');
            });
            blokovane = false;
        }

        document.getElementById('btn-tvrde').setAttribute('data-text', 'Tvrdé Y');
        document.getElementById('btn-makke').setAttribute('data-text', 'Mäkké I');

        function triggerFireworks() {
            const overlay = document.getElementById('fireworks-overlay');
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.backgroundColor = `hsl(${Math.random()*360}, 80%, 60%)`;
                p.style.left = '50%'; p.style.top = '50%';
                overlay.appendChild(p);
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 400 + 100;
                p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px) scale(0)`, opacity: 0 }], { duration: 2500, easing: 'ease-out' }).onfinish = () => p.remove();
            }
        }

        function check(typ) {
            if (blokovane) return;
            blokovane = true;
            const btn = document.getElementById('btn-' + typ);
            
            if (typ === poradie[index].odpoved) {
                btn.innerHTML += '<span class="icon">✅</span>';
                document.querySelectorAll('button').forEach(b => b.disabled = true);
                setTimeout(() => { document.getElementById('slovo').innerText = poradie[index].cele; }, 500);
                triggerFireworks();
                index++;
                setTimeout(novaUloha, 2500);
            } else {
                btn.innerHTML += '<span class="icon">❌</span>';
                setTimeout(() => { blokovane = false; btn.innerHTML = btn.getAttribute('data-text'); }, 1000);
            }
        }

        zamiesajSadu();
        novaUloha();
    </script>
</body>
</html>
